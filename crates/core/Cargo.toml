[package]
name = "hearth-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
hearth-protocol = { path = "../protocol" }
rustix = { version = "1.1.6", features = ["fs"] }
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
